<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Edad en Años Humanos - Tortugas</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>🐢 Calculadora de Edad en Años Humanos 🐢</h1>
        <p>Ingresa la edad de tu tortuga y descubre su edad en años humanos.</p>

        <label for="turtle-age">Edad de la tortuga en años reales:</label>
        <input type="number" id="turtle-age" min="0" placeholder="Ej. 6">
        <button onclick="calculateHumanAge()">Calcular</button>

        <p id="result"></p>
        
        <img src="turtle.png" alt="Tortuga" class="turtle-img">
    </div>

    <script src="script.js"></script>
</body>
</html>
